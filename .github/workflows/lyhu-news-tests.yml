name: LYHU publisher tests
on:
  pull_request:
    paths: ['tools/lyhu-news/**', '.github/workflows/lyhu-news-*.yml']
  push:
    branches: ['codex/lyhu-independent-publisher']
    paths: ['tools/lyhu-news/**', '.github/workflows/lyhu-news-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
        working-directory: tools/lyhu-news
