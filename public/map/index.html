<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Nhà Phân Phối Việt Nam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container" id="dashboard">
        <!-- Header -->
        <header class="header">
            <h1>Theo Dõi Chỉ Tiêu Doanh Số Nhà Phân Phối</h1>
            <div class="legend">
                <div class="legend-item">
                    <span class="color-box filled"></span> Đã có NPP
                </div>
                <div class="legend-item">
                    <span class="color-box empty"></span> Còn trống (Cần mở)
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Map Container -->
            <div class="map-wrapper" id="map-container">
                <!-- SVG will be injected here via JS -->
            </div>

            <!-- Sidebar / Stats -->
            <aside class="sidebar">
                <div class="summary-card">
                    <h2>Tổng quan thị trường</h2>
                    <div class="stat-row">
                        <span class="stat-label">Tổng số tỉnh/thành:</span>
                        <span class="stat-value" id="total-provinces">63</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Đã phủ NPP:</span>
                        <span class="stat-value highlight" id="covered-provinces">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Thị trường trống:</span>
                        <span class="stat-value warning" id="empty-provinces">0</span>
                    </div>
                </div>

                <div class="info-card" id="province-details">
                    <h2 class="province-title" id="side-title">Chọn một khu vực</h2>
                    <p class="instruction" id="side-instruction">Hover hoặc click vào bản đồ để xem chi tiết doanh số dự kiến.</p>
                    
                    <div class="targets-container" id="side-targets" style="display: none;">
                        <div class="status-badge" id="npp-status">Trạng thái</div>
                        
                        <h3>Chỉ tiêu độc quyền:</h3>
                        <ul class="target-list" id="target-list">
                            <!-- Targets will be injected here -->
                        </ul>
                        
                        <div class="total-revenue">
                            <span>Tổng dự kiến:</span>
                            <strong id="total-revenue-value">0 VNĐ</strong>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Tooltip element -->
    <div id="tooltip" class="tooltip"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
